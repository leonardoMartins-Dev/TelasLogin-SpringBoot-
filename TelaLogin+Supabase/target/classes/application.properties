spring.application.name=TelaLogin

# =========================================================
# ADMINISTRADOR
# =========================================================

# Usado só pelo AdminSeeder para criar o admin no Supabase na primeira
# subida. Usuários comuns são criados pela página /register.
app.admin.username=admin
app.admin.password=1234
app.admin.name=Administrador


# =========================================================
# GMAIL
# =========================================================

# https://myaccount.google.com/apppasswords
# Credenciais reais ficam no arquivo .env (não versionado)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================================
# GOOGLE reCAPTCHA
# =========================================================

# Chaves reais ficam no arquivo .env (não versionado)
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}


# =========================================================
# SUPABASE (PostgreSQL)
# =========================================================

# Use a connection string do "Session pooler" (porta 5432) em
# Supabase > Connect > Type: JDBC > Method: Session pooler.
# Os valores vêm do .env para não versionar a senha.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres.sehffrsfrhudocqlchbo}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeno: o plano free do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5

# A tabela é criada pelo script supabase/schema.sql; o Hibernate não altera o banco
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
